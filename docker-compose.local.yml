services:
  scriberr-sidecarr:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${SIDECARR_WEBHOOK_PORT:-8080}"
    volumes:
      - ${SIDECARR_TRANSCRIPTS_HOST_PATH:-/media/holocron/Storage/Backups/voice_recordings/scriberr_data/app_data/transcripts}:/watch/transcripts:ro
      - ${SIDECARR_DATA_HOST_PATH:-./data}:/app/data

  scriberr-router:
    build:
      context: .
      dockerfile: router/Dockerfile
    restart: unless-stopped
    profiles:
      - gateway
    ports:
      - "${SCRIBERR_GATEWAY_PORT:-8383}:8080"
